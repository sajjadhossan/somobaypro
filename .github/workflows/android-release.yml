name: 🚀 Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-apk:
    name: 📱 Build & Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: ⚙️ Configure Android SDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          cat android/local.properties
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true

      - name: 🏷️ Determine Version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          CLEAN_VER="${TAG#v}"
          CODE=$(echo "$CLEAN_VER" | tr -dc '0-9')
          if [ -z "$CODE" ]; then CODE=2; fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$CLEAN_VER" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$CODE" >> $GITHUB_OUTPUT
          echo "Building version $CLEAN_VER (code $CODE) for tag $TAG"

      - name: 📝 Update Version in build.gradle
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ steps.ver.outputs.VERSION_CODE }}/" android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "${{ steps.ver.outputs.VERSION_NAME }}"/' android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: 🔨 Build Android Release APK
        working-directory: android
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m"
        run: |
          gradle assembleRelease --no-daemon --stacktrace

      - name: 📦 Prepare APK Package
        run: |
          mkdir -p release-apk
          APK_FILE=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ Error: Release APK was not found!"
            find android/app/build/outputs/ -type f
            exit 1
          fi
          echo "✅ Found APK at: $APK_FILE"
          cp "$APK_FILE" "release-apk/SomobayPro-${{ steps.ver.outputs.TAG }}.apk"
          ls -la release-apk/

      - name: 💾 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SomobayPro-${{ steps.ver.outputs.TAG }}-apk
          path: release-apk/*.apk
          retention-days: 30

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.TAG }}
          name: "🏛️ প্রগতি কল্যাণ সমবায় সমিতি ${{ steps.ver.outputs.TAG }}"
          body: |
            ## 📱 SomobayPro Android APK — ${{ steps.ver.outputs.TAG }}

            **প্রগতি কল্যাণ সমবায় সমিতি লিমিটেড** — আধুনিক ও ডিজিটাল সমবায় সমিতি ম্যানেজমেন্ট সিস্টেম

            ---

            ### 🆕 এই ভার্সনে যা যা রয়েছে:
            - 🎙️ **স্মার্ট বাংলা ভয়েস নেভিগেশন** — মুখে বললেই পেজ/মডাল ওপেন হয়
            - ⚡ **ভয়েস ডিপোজিট অটো-ফিল** — মুখে বলে ব্যাংক জমার ফর্ম পূরণ
            - 🔊 **প্রাকৃতিক মিষ্টি বাংলা TTS** — Google Bangla voice দিয়ে AI কথা বলে
            - 🤖 **Somobay AI (Gemini)** — ব্যাংক স্লিপ স্ক্যান ও বাংলায় কথোপকথন
            - 🛡️ **সম্পূর্ণ সুদমুক্ত নীতি (Strictly No Loans)** — কঠোরভাবে বলবৎ
            - 🔐 **স্মার্ট পারমিশন গেট** — অ্যাপ ওপেনের সাথে সাথে ক্যামেরা, মাইক, স্টোরেজ পারমিশন নিয়ে নিবে
            - 📗 ডিজিটাল পাসবুক | 📜 শেয়ার সনদ | 🪪 আইডি কার্ড | 🧾 ডিজিটাল রসিদ

            ---

            ### 📲 ইনস্টলেশন গাইড:
            1. নিচে দেওয়া **SomobayPro-${{ steps.ver.outputs.TAG }}.apk** ফাইলটি ডাউনলোড করুন
            2. আপনার ফোনের **Settings → Security / Install unknown apps** অনুমোদন করুন
            3. অ্যাপ ওপেন করে প্রয়োজনীয় সকল পারমিশন প্রদান করুন
            4. আপনার মোবাইল ও পাসওয়ার্ড দিয়ে লগইন করুন

            ---

            > 🌐 **ওয়েব ভার্সন:** https://somobaypro.onrender.com  
            > 📱 **সাপোর্টেড অ্যান্ড্রয়েড:** Android 7.0+ (API 24+)
          files: release-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
