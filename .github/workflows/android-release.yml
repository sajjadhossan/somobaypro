name: 🚀 Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. v1.0.3)'
        required: true
        default: 'v1.0.3'

permissions:
  contents: write

jobs:
  build-apk:
    name: 📱 Build & Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: ⚙️ Configure Android SDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true

      - name: 🏷️ Determine Version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          CLEAN_VER="${TAG#v}"
          # Create versionCode from version numbers e.g. 1.0.3 -> 10003
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_VER"
          CODE=$(( ${MAJOR:-1} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$CLEAN_VER" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$CODE" >> $GITHUB_OUTPUT
          echo "✅ Building version $CLEAN_VER (versionCode: $CODE) for tag $TAG"

      - name: 📝 Update Version in build.gradle
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ steps.ver.outputs.VERSION_CODE }}/" android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "${{ steps.ver.outputs.VERSION_NAME }}"/' android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: 🔑 Setup Release Keystore
        run: |
          echo "✅ Setting up production release keystore for consistent APK signing..."
          cat << 'KEYSTOREEOF' | base64 -d > android/app/somobaypro-release.keystore
          
          KEYSTOREEOF
          echo "✅ Keystore restored from embedded data"
          ls -la android/app/somobaypro-release.keystore

      - name: 🔨 Build Android Release APK
        working-directory: android
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m"
        run: |
          gradle assembleRelease --no-daemon --stacktrace

      - name: 📦 Prepare APK Package
        run: |
          mkdir -p release-apk
          APK_FILE=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ APK not found!"
            find android/app/build/outputs/ -type f 2>/dev/null
            exit 1
          fi
          echo "✅ Found APK: $APK_FILE"
          cp "$APK_FILE" "release-apk/SomobayPro-${{ steps.ver.outputs.TAG }}.apk"
          ls -la release-apk/

      - name: 💾 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SomobayPro-${{ steps.ver.outputs.TAG }}-apk
          path: release-apk/*.apk
          retention-days: 90

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.TAG }}
          name: "📱 সমবায় প্রো ${{ steps.ver.outputs.TAG }}"
          body: |
            ## 📱 সমবায় প্রো (SomobayPro) — ${{ steps.ver.outputs.TAG }}

            **প্রগতি কল্যাণ সমবায় সমিতি লিমিটেড** — আধুনিক ডিজিটাল সমবায় ম্যানেজমেন্ট সিস্টেম

            ---

            ### ✅ আপডেট সিস্টেম:
            > এখন থেকে নতুন APK ইনস্টল করলেই সরাসরি **আপডেট** হয়ে যাবে।  
            > পুরানো অ্যাপ **ডিলিট করা লাগবে না।**

            ---

            ### 🆕 এই ভার্সনে:
            - 🎙️ স্মার্ট বাংলা ভয়েস নেভিগেশন
            - ⚡ ভয়েস ডিপোজিট অটো-ফিল
            - 🔊 প্রাকৃতিক মিষ্টি বাংলা TTS
            - 🤖 Somobay AI (Gemini) — ব্যাংক স্লিপ স্ক্যান
            - 🔐 স্মার্ট পারমিশন গেট — অ্যাপ ওপেনে সব পারমিশন নেয়
            - 🛡️ সম্পূর্ণ সুদমুক্ত (Strictly No Loans)

            ---

            ### 📲 ইনস্টলেশন:
            1. নিচের **APK ফাইল** ডাউনলোড করুন
            2. **Settings → Install unknown apps** অনুমোদন করুন
            3. ইনস্টল করুন (আগের ভার্সন থাকলে সরাসরি আপডেট হবে ✅)
            4. লগইন করুন

            ---

            > 🌐 **ওয়েব:** https://somobaypro.onrender.com  
            > 📱 **Android:** 7.0+ (API 24+) | versionCode: ${{ steps.ver.outputs.VERSION_CODE }}
          files: release-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
