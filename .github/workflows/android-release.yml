name: 🚀 Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-web:
    name: 🌐 Build Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Build web bundle
        run: pnpm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/

  build-apk:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    needs: build-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew 2>/dev/null || true

      - name: Set VERSION_CODE and VERSION_NAME
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER="${{ github.ref_name }}"
          fi
          CODE=$(echo "$VER" | tr -dc '0-9' | head -c 6)
          echo "VERSION_NAME=${VER#v}" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=${CODE:-1}" >> $GITHUB_OUTPUT

      - name: Update version in build.gradle
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ steps.version.outputs.VERSION_CODE }}/" android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "${{ steps.version.outputs.VERSION_NAME }}"/' android/app/build.gradle

      - name: Install Gradle wrapper
        run: |
          mkdir -p android/gradle/wrapper
          curl -sL -o android/gradle/wrapper/gradle-wrapper.jar \
            https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar || \
          wget -q -O android/gradle/wrapper/gradle-wrapper.jar \
            https://services.gradle.org/distributions/gradle-8.4-wrapper.jar || true

      - name: Create gradlew script
        run: |
          cat > android/gradlew << 'GRADLEW'
          #!/bin/sh
          exec java $GRADLE_OPTS "-Dorg.gradle.appname=$APP_BASE_NAME" \
            -classpath "$APP_HOME/gradle/wrapper/gradle-wrapper.jar" \
            org.gradle.wrapper.GradleWrapperMain "$@"
          GRADLEW
          chmod +x android/gradlew

      - name: Build Release APK
        working-directory: android
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g"
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1

      - name: Rename APK
        run: |
          mkdir -p release-apk
          VERSION="${{ steps.version.outputs.VERSION_NAME }}"
          cp android/app/build/outputs/apk/release/app-release.apk \
             "release-apk/SomobayPro-${VERSION}-release.apk" 2>/dev/null || \
          cp android/app/build/outputs/apk/release/*.apk \
             "release-apk/SomobayPro-${VERSION}-release.apk" 2>/dev/null || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: release-apk/*.apk
          retention-days: 90

  release:
    name: 📦 GitHub Release
    runs-on: ubuntu-latest
    needs: build-apk
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set VERSION
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: apk-release
          path: release-apk/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.TAG }}
          name: "🏛️ প্রগতি কল্যাণ সমবায় সমিতি ${{ steps.ver.outputs.TAG }}"
          body: |
            ## 📱 SomobayPro Android APK — ${{ steps.ver.outputs.TAG }}

            **প্রগতি কল্যাণ সমবায় সমিতি লিমিটেড** — ডিজিটাল সমবায় ম্যানেজমেন্ট সিস্টেম

            ---

            ### 🆕 এই ভার্সনে যা যা আছে:
            - 🎙️ **স্মার্ট বাংলা ভয়েস নেভিগেশন** — মুখে বললেই পেজ/মডাল ওপেন হয়
            - ⚡ **ভয়েস ডিপোজিট অটো-ফিল** — মুখে বলে ব্যাংক জমার ফর্ম পূরণ
            - 🔊 **প্রাকৃতিক মিষ্টি বাংলা TTS** — Google Bangla voice দিয়ে AI কথা বলে
            - 🤖 **Somobay AI (Gemini)** — ব্যাংক স্লিপ স্ক্যান ও বাংলায় কথোপকথন
            - 🛡️ **সম্পূর্ণ সুদমুক্ত নীতি (No Loans)** — কঠোরভাবে বলবৎ
            - 📗 ডিজিটাল পাসবুক | 📜 শেয়ার সনদ | 🪪 আইডি কার্ড | 🧾 ডিজিটাল রসিদ

            ---

            ### 📲 ইনস্টলেশন গাইড:
            1. নিচ থেকে **APK ফাইলটি** ডাউনলোড করুন
            2. Android ফোনের **Settings → Security → Unknown Sources** চালু করুন
            3. ডাউনলোড করা APK ফাইলে ট্যাপ করে ইনস্টল করুন
            4. অ্যাপ ওপেন হলে সকল অনুমতি (ক্যামেরা, মাইক, নোটিফিকেশন) দিন
            5. তারপর লগইন করুন

            ---

            ### ⚠️ প্রয়োজনীয় অনুমতি:
            | অনুমতি | কারণ |
            |--------|------|
            | 📷 Camera | ব্যাংক স্লিপ স্ক্যান ও KYC ছবি |
            | 🎙️ Microphone | Somobay AI ভয়েস সহকারী |
            | 🔔 Notifications | জমা অনুমোদন ও সোসাইটি নোটিশ |
            | 📁 Storage | রসিদ ডাউনলোড ও পাসবুক প্রিন্ট |

            ---

            > 🌐 **ওয়েব অ্যাপ:** https://somobaypro.onrender.com
            > 📱 **Minimum Android:** Android 7.0 (API 24)
          files: release-apk/*.apk
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
