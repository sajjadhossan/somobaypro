name: 🔑 Generate & Save Release Keystore

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-keystore:
    name: Generate Keystore Once
    runs-on: ubuntu-latest

    steps:
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔑 Generate Release Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore somobaypro-release.keystore \
            -alias somobaypro \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass SomobayPro@2024! \
            -keypass SomobayPro@2024! \
            -dname "CN=SomobayPro, OU=Development, O=Pragati Kalyan Somobay Samiti Ltd, L=Dhaka, ST=Dhaka, C=BD"

      - name: 📦 Convert to Base64
        run: |
          base64 -w 0 somobaypro-release.keystore > keystore_base64.txt
          echo ""
          echo "======= COPY THIS BASE64 VALUE TO GITHUB SECRET 'KEYSTORE_BASE64' ======="
          cat keystore_base64.txt
          echo ""
          echo "========================================================================"

      - name: 💾 Upload Keystore as Artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: somobaypro-release-keystore
          path: somobaypro-release.keystore
          retention-days: 1
