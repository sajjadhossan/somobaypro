name: 🔑 Auto-Save Keystore to GitHub Secret

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup-keystore-secret:
    name: Generate Keystore & Auto-Save to Secret
    runs-on: ubuntu-latest

    steps:
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔑 Generate Release Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore somobaypro-release.keystore \
            -alias somobaypro \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass SomobayPro@2024! \
            -keypass SomobayPro@2024! \
            -dname "CN=SomobayPro, OU=Development, O=Pragati Kalyan Somobay Samiti Ltd, L=Dhaka, ST=Dhaka, C=BD"
          echo "✅ Keystore generated successfully"
          ls -la somobaypro-release.keystore

      - name: 📦 Convert to Base64
        run: |
          base64 -w 0 somobaypro-release.keystore > keystore_base64.txt
          echo "✅ Converted to Base64"

      - name: 🔐 Save KEYSTORE_BASE64 to GitHub Secrets via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install PyNaCl -q
          python3 << 'PYTHON'
          import os, base64, json, sys
          import urllib.request
          from nacl import encoding, public

          token = os.environ["GH_TOKEN"]
          repo = "sajjadhossan/somobaypro"

          # Read keystore base64
          with open("keystore_base64.txt", "r") as f:
              secret_value = f.read().strip()

          print(f"Keystore base64 length: {len(secret_value)}")

          # Get public key
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/secrets/public-key",
              headers={"Authorization": f"token {token}", "Accept": "application/vnd.github.v3+json"}
          )
          with urllib.request.urlopen(req) as response:
              pub_key_data = json.loads(response.read())

          key_id = pub_key_data["key_id"]
          pub_key_b64 = pub_key_data["key"]
          print(f"Got public key ID: {key_id}")

          # Encrypt using libsodium sealed box
          pub_key_bytes = base64.b64decode(pub_key_b64)
          sealed_box = public.SealedBox(public.PublicKey(pub_key_bytes))
          encrypted = sealed_box.encrypt(secret_value.encode())
          encrypted_b64 = base64.b64encode(encrypted).decode()

          # Set the secret
          payload = json.dumps({
              "encrypted_value": encrypted_b64,
              "key_id": key_id
          }).encode()

          req2 = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/secrets/KEYSTORE_BASE64",
              data=payload,
              method="PUT",
              headers={
                  "Authorization": f"token {token}",
                  "Accept": "application/vnd.github.v3+json",
                  "Content-Type": "application/json"
              }
          )
          with urllib.request.urlopen(req2) as resp:
              print(f"✅ KEYSTORE_BASE64 secret saved! Status: {resp.status}")
          PYTHON

      - name: 💾 Backup Keystore as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: somobaypro-release-keystore-BACKUP
          path: somobaypro-release.keystore
          retention-days: 1
